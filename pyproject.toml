[project]
name = "ugrc-shadow"
version = "0.1.0"
description = "A dark-mode restyling of UGRC's Lite vector basemap for MapLibre."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pillow>=10.4",
    "mini-racer>=0.12",
]

[project.scripts]
ugrc-shadow = "ugrc_shadow.build:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ugrc_shadow"]

[tool.ruff]
line-length = 100
