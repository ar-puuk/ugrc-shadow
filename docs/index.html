<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGRC Vector Map Tile Styles</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1013'/%3E%3Cpath d='M50 8a42 42 0 000 84z' fill='%23f2b84b'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23272a31' stroke-width='4'/%3E%3C/svg%3E">
<script>
  // Applies a saved explicit theme choice before first paint, so there's no flash of the wrong
  // theme while the deferred module script below loads. No saved choice = follow the OS/browser
  // setting via the CSS "prefers-color-scheme" rules alone; this only ever sets the override.
  (function () {
    try {
      var t = localStorage.getItem("ugrc-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* private browsing, disabled storage, etc. - just follow the OS setting */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css">
<style>
  /* shadcn/ui's own "zinc" theme values (light below, dark further down), with --primary/--ring
     overridden to this site's amber/blue brand accents - the common "neutral base + one brand
     accent" pattern most real shadcn-based apps use rather than the fully neutral default. Tokens
     are bare "H S% L%" triplets (no hsl() wrapper) so any usage can add an alpha channel via
     hsl(var(--x) / 0.5) without a second variable. */
  :root {
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --popover: 0 0% 100%;
    --popover-foreground: 240 10% 3.9%;
    --primary: 39 87% 62%;
    --primary-foreground: 240 10% 10%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 217 91% 72%;
    --destructive: 0 84% 60%;
    --destructive-foreground: 0 0% 98%;
    --radius: 0.5rem;
    /* Shared checkerboard pattern for anything that might show a transparent color (the color-
       picker's swatch trigger, preview chip, and alpha slider track) - defined once here rather
       than repeated per usage; resolves against whichever theme's --muted-foreground is active,
       so it doesn't need its own light/dark redeclaration. */
    --checker-bg:
      linear-gradient(45deg, hsl(var(--muted-foreground) / .35) 25%, transparent 25%),
      linear-gradient(-45deg, hsl(var(--muted-foreground) / .35) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, hsl(var(--muted-foreground) / .35) 75%),
      linear-gradient(-45deg, transparent 75%, hsl(var(--muted-foreground) / .35) 75%);
  }
  /* Dark mode: follows the OS/browser by default (prefers-color-scheme); an explicit
     data-theme="light"/"dark" from the toggle button below wins over that in either direction.
     CSS can't "OR" a media condition with an attribute selector in one rule, so the same dark
     values are declared twice - once gated on the media query (skipped if data-theme="light" is
     forcing light), once gated on data-theme="dark" (wins regardless of the OS setting). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 6% 7.5%;
      --card-foreground: 0 0% 98%;
      --popover: 240 6% 9%;
      --popover-foreground: 0 0% 98%;
      --primary: 39 87% 62%;
      --primary-foreground: 240 10% 10%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 18%;
      --ring: 217 91% 72%;
      --destructive: 0 62.8% 40%;
      --destructive-foreground: 0 0% 98%;
    }
  }
  :root[data-theme="dark"] {
    --background: 240 10% 3.9%;
    --foreground: 0 0% 98%;
    --card: 240 6% 7.5%;
    --card-foreground: 0 0% 98%;
    --popover: 240 6% 9%;
    --popover-foreground: 0 0% 98%;
    --primary: 39 87% 62%;
    --primary-foreground: 240 10% 10%;
    --muted: 240 3.7% 15.9%;
    --muted-foreground: 240 5% 64.9%;
    --border: 240 3.7% 15.9%;
    --input: 240 3.7% 18%;
    --ring: 217 91% 72%;
    --destructive: 0 62.8% 40%;
    --destructive-foreground: 0 0% 98%;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: hsl(var(--background)); color: hsl(var(--foreground));
    font: 14px/1.4 "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  .app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px;
    padding: 10px 16px;
    background: hsl(var(--card));
    border-bottom: 1px solid hsl(var(--border));
    z-index: 5;
  }
  .brand { margin-right: auto; display: flex; align-items: center; gap: 7px; }
  .brand-dot {
    width: 9px; height: 9px; flex: none; border-radius: 50%;
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--ring)));
    box-shadow: 0 0 8px hsl(var(--primary) / 0.55);
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .1px; }
  .divider { align-self: stretch; min-height: 22px; width: 1px; background: hsl(var(--border)); flex: none; }

  /* Same custom-combobox pattern as index.html's picker - see docs/assets/dropdown.js. Modeled on
     shadcn's Select: a bordered trigger matching Input, a popover menu with a checkmark-style dot
     for the selected row instead of a background fill (shadcn uses an actual check icon; a small
     accent dot reads the same way without adding an inline svg per row here). */
  .dd { position: relative; }
  .dd-button {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500;
    width: 10em;
    padding: 6px 8px 6px 10px;
    border: 1px solid hsl(var(--input)); border-radius: var(--radius);
    background: hsl(var(--background));
    cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .dd-button-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-chevron { width: 10px; height: 6px; flex: none; margin-left: auto; color: hsl(var(--muted-foreground)); transition: transform .15s ease; }
  .dd-button:hover { background: hsl(var(--muted)); }
  .dd-button:focus-visible {
    outline: none; border-color: hsl(var(--ring));
    box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25);
  }
  .dd-button[aria-expanded="true"] .dd-chevron { transform: rotate(180deg); }
  .dd-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
    margin: 0; padding: 5px; list-style: none;
    min-width: 100%; width: max-content; max-width: 280px; max-height: 60vh; overflow-y: auto;
    background: hsl(var(--popover)); border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    box-shadow: 0 4px 6px hsl(var(--foreground) / 0.05), 0 10px 24px hsl(var(--foreground) / 0.12);
  }
  .dd-menu:focus { outline: none; }
  .dd-option {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px;
    border-radius: calc(var(--radius) - 2px); cursor: pointer;
  }
  .dd-option-dot {
    width: 6px; height: 6px; margin-top: 5px; flex: none; border-radius: 50%;
    background: hsl(var(--ring)); opacity: 0; transition: opacity .1s ease;
  }
  .dd-option.is-selected .dd-option-dot { opacity: 1; }
  .dd-option-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .dd-option-label { font-size: 13px; font-weight: 500; color: hsl(var(--popover-foreground)); }
  .dd-option.is-selected .dd-option-label { color: hsl(var(--ring)); }
  .dd-option-desc {
    font-size: 11px; font-weight: 400; color: hsl(var(--muted-foreground)); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .dd-option.is-active { background: hsl(var(--muted)); }

  /* shadcn Button, "outline"-ish variant by default (border + subtle fill) with .btn-primary for
     the "default" (solid) variant. */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius); border: 1px solid hsl(var(--border));
    background: hsl(var(--background)); color: hsl(var(--foreground));
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .btn:hover:not(:disabled) { background: hsl(var(--muted)); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; }
  .btn-primary:hover:not(:disabled) { background: hsl(var(--primary) / 0.9); }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: none; border-radius: 50%; border: none;
    background: transparent; color: hsl(var(--muted-foreground)); cursor: pointer; text-decoration: none;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
  .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25); }

  main { flex: 1; display: flex; min-height: 0; }

  aside {
    display: flex; flex-direction: column;
    width: 300px; flex: none;
    background: hsl(var(--card));
    border-right: 1px solid hsl(var(--border));
  }
  aside.right { border-right: none; border-left: 1px solid hsl(var(--border)); }

  .panel-head {
    padding: 10px 12px; border-bottom: 1px solid hsl(var(--border));
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .panel-head h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: hsl(var(--muted-foreground)); }
  .search-input {
    width: 100%; padding: 7px 10px; border-radius: var(--radius); border: 1px solid hsl(var(--input));
    background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 13px;
  }
  .search-input::placeholder { color: hsl(var(--muted-foreground)); }

  #layer-list { flex: 1; overflow-y: auto; }
  .service-header {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border: none; border-bottom: 1px solid hsl(var(--border));
    background: hsl(var(--muted) / 0.5); color: hsl(var(--foreground));
    font-size: 12px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .service-header:hover { background: hsl(var(--muted)); }
  .service-header:focus-visible { outline: none; box-shadow: inset 0 0 0 2px hsl(var(--ring)); }
  .service-chevron { width: 1em; flex: none; color: hsl(var(--muted-foreground)); }
  .service-name { flex: 1 1 auto; }
  .service-count { flex: none; font-size: 10.5px; font-weight: 500; color: hsl(var(--muted-foreground)); }
  .group-body { padding-left: 12px; } /* compounds through nesting - deeper groups indent further */
  .group-header {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 10px 6px 8px; border: none; border-bottom: 1px solid hsl(var(--border) / 0.6);
    background: transparent; color: hsl(var(--muted-foreground));
    font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .group-header:hover { background: hsl(var(--muted) / 0.7); color: hsl(var(--foreground)); }
  .group-header:focus-visible { outline: none; box-shadow: inset 0 0 0 2px hsl(var(--ring)); }
  .group-chevron { width: 1em; flex: none; }
  .group-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-count { flex: none; font-size: 10px; }
  .layer-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; cursor: pointer; border-bottom: 1px solid hsl(var(--border) / 0.5);
  }
  .layer-row:hover { background: hsl(var(--muted) / 0.6); }
  .layer-row.is-selected { background: hsl(var(--ring) / 0.15); }
  .layer-row.is-dragging { opacity: .4; }
  .layer-row.drag-over { box-shadow: inset 0 2px 0 hsl(var(--ring)); }
  .layer-row input[type=checkbox] { flex: none; }
  .drag-handle { flex: none; color: hsl(var(--muted-foreground)); font-size: 12px; line-height: 1; cursor: grab; }
  .layer-tag {
    flex: none; font-size: 9px; font-weight: 700; letter-spacing: .03em;
    padding: 2px 5px; border-radius: calc(var(--radius) - 3px); color: hsl(var(--muted-foreground));
    background: hsl(var(--muted));
  }
  .layer-id { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .layer-id.is-hidden-layer { color: hsl(var(--muted-foreground)); text-decoration: line-through; }
  .layer-swatch { flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1px solid hsl(var(--border)); }
  #layer-empty { padding: 16px 12px; color: hsl(var(--muted-foreground)); font-size: 12.5px; }

  #map-wrap { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; }

  #prop-body { flex: 1; overflow-y: auto; padding: 12px; }
  .prop-empty { color: hsl(var(--muted-foreground)); font-size: 13px; }
  .prop-layer-id { font-size: 13px; font-weight: 600; word-break: break-word; margin: 0 0 2px; }
  .prop-layer-type { font-size: 11px; color: hsl(var(--muted-foreground)); margin: 0 0 14px; }
  .prop-row { margin-bottom: 14px; }
  .prop-row label { display: block; font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-bottom: 5px; }
  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-row input[type=text] {
    flex: 1 1 auto; min-width: 0; padding: 6px 8px; border-radius: calc(var(--radius) - 2px); border: 1px solid hsl(var(--input));
    background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 12.5px; font-family: monospace;
  }

  .color-swatch-btn {
    position: relative; flex: none; width: 30px; height: 30px; padding: 0;
    border: 1px solid hsl(var(--input)); border-radius: calc(var(--radius) - 2px);
    overflow: hidden; cursor: pointer;
  }
  .color-swatch-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25); }
  .color-swatch-fill { position: absolute; inset: 0; }
  .color-swatch-btn::before {
    content: ""; position: absolute; inset: 0;
    background-image: var(--checker-bg); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  }

  /* The color picker popover itself - a floating shadcn-style card, positioned in JS
     (ColorPickerPopover._position()) since it's a single shared instance reused by every color
     row rather than one popover per row. */
  .cp-popover {
    position: fixed; z-index: 50; width: 216px;
    padding: 12px; border-radius: var(--radius);
    background: hsl(var(--popover)); border: 1px solid hsl(var(--border));
    box-shadow: 0 4px 6px hsl(var(--foreground) / 0.05), 0 10px 24px hsl(var(--foreground) / 0.12);
  }
  .cp-square {
    position: relative; height: 140px; border-radius: calc(var(--radius) - 2px);
    cursor: crosshair; touch-action: none;
  }
  .cp-square-thumb {
    position: absolute; width: 14px; height: 14px; margin: -7px;
    border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
    pointer-events: none;
  }
  .cp-sliders { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .cp-hue, .cp-alpha { width: 100%; }
  /* input[type="range"].cp-hue rather than plain .cp-hue: the generic input[type="range"] reset
     rules further down (higher specificity - element + attribute selector) would otherwise beat a
     bare class selector's background-image regardless of which comes later in the file.
     -webkit-*/-moz-* pseudo-elements are deliberately each their OWN rule, never combined in one
     comma-separated selector list: a browser that doesn't recognize even one selector in such a
     list drops the ENTIRE rule, not just the branch it doesn't understand - so combining them
     would make Chrome discard the whole thing over the unknown ::-moz-range-track, and Firefox
     discard it over the unknown ::-webkit-slider-runnable-track. */
  input[type="range"].cp-hue::-webkit-slider-runnable-track {
    background-image: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  input[type="range"].cp-hue::-moz-range-track {
    background-image: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  input[type="range"].cp-alpha::-webkit-slider-runnable-track {
    background-image: var(--cp-tint, none), var(--checker-bg);
    background-size: auto, 8px 8px, 8px 8px, 8px 8px, 8px 8px;
    background-position: 0 0, 0 0, 0 4px, 4px -4px, -4px 0;
  }
  input[type="range"].cp-alpha::-moz-range-track {
    background-image: var(--cp-tint, none), var(--checker-bg);
    background-size: auto, 8px 8px, 8px 8px, 8px 8px, 8px 8px;
    background-position: 0 0, 0 0, 0 4px, 4px -4px, -4px 0;
  }
  .cp-fields { margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .cp-preview {
    flex: none; width: 24px; height: 24px; border-radius: calc(var(--radius) - 3px);
    border: 1px solid hsl(var(--input));
    background-image: linear-gradient(var(--cp-preview-color, transparent), var(--cp-preview-color, transparent)), var(--checker-bg);
    background-size: auto, 8px 8px, 8px 8px, 8px 8px, 8px 8px;
    background-position: 0 0, 0 0, 0 4px, 4px -4px, -4px 0;
  }
  .cp-hex-input {
    flex: 1 1 auto; min-width: 0; padding: 5px 7px; border-radius: calc(var(--radius) - 3px);
    border: 1px solid hsl(var(--input)); background: hsl(var(--background)); color: hsl(var(--foreground));
    font-size: 12px; font-family: monospace;
  }
  .cp-alpha-field {
    flex: none; display: flex; align-items: center; gap: 2px;
    padding: 5px 7px; border-radius: calc(var(--radius) - 3px);
    border: 1px solid hsl(var(--input)); background: hsl(var(--background));
    font-size: 12px; color: hsl(var(--muted-foreground));
  }
  .cp-alpha-field input {
    width: 2.2em; border: none; background: none; padding: 0; text-align: right;
    color: hsl(var(--foreground)); font-size: 12px; font-family: monospace;
  }
  .cp-alpha-field input:focus-visible { outline: none; }
  .cp-eyedropper-btn {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: calc(var(--radius) - 3px);
    border: 1px solid hsl(var(--input)); background: hsl(var(--background)); color: hsl(var(--muted-foreground));
    cursor: pointer;
  }
  .cp-eyedropper-btn:hover { background: hsl(var(--muted)); color: hsl(var(--foreground)); }
  .cp-eyedropper-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25); }
  .cp-eyedropper-btn svg { width: 14px; height: 14px; }

  .number-row { display: flex; align-items: center; gap: 8px; }
  .number-row input[type=range] { flex: 1 1 auto; }
  .number-row output { flex: none; width: 3em; text-align: right; font-size: 11.5px; color: hsl(var(--muted-foreground)); font-family: monospace; }
  .prop-select, .prop-text-input {
    width: 100%; padding: 6px 8px; border-radius: calc(var(--radius) - 2px); border: 1px solid hsl(var(--input));
    background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 12.5px;
  }
  .prop-text-input { font-family: monospace; }
  .checkbox-label { display: flex !important; align-items: center; gap: 6px; cursor: pointer; }
  .raw-prop-input {
    width: 100%; padding: 6px 8px; border-radius: calc(var(--radius) - 2px); border: 1px solid hsl(var(--input));
    background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 11.5px; font-family: monospace;
    resize: vertical;
  }
  .raw-prop-error { font-size: 11px; color: hsl(var(--destructive)); margin-top: 4px; }
  .prop-section { margin: 18px 0 14px; padding-top: 14px; border-top: 1px solid hsl(var(--border)); }
  .prop-section-title { margin: 0 0 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: hsl(var(--muted-foreground)); }
  .filter-row { display: flex; gap: 6px; }
  .filter-row .prop-select { flex: 0 0 4.5em; }
  .filter-row .filter-field { flex: 1 1 auto; }
  .filter-row .filter-value { flex: 1 1 auto; }
  .zoom-row { display: flex; align-items: center; gap: 6px; }
  .zoom-row label { font-size: 11.5px; color: hsl(var(--muted-foreground)); }
  .zoom-row .zoom-input { width: 5em; flex: none; }
  .prop-actions { display: flex; gap: 8px; margin: 16px 0; }
  details.raw-json summary { cursor: pointer; font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }
  .raw-json pre {
    margin: 0; padding: 8px; border-radius: calc(var(--radius) - 2px); background: hsl(var(--muted));
    color: hsl(var(--foreground));
    font-size: 11px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto;
  }

  /* Search/select/text/raw-prop inputs above all share this focus treatment. */
  .search-input:focus-visible, .prop-select:focus-visible, .prop-text-input:focus-visible,
  .raw-prop-input:focus-visible, select:focus-visible, .color-row input[type=text]:focus-visible {

  #status {

  /* Native form controls (checkbox/range/select) ship with no shadcn styling at all by default -

  input[type="checkbox"] {

  input[type="checkbox"]:checked { background: hsl(var(--primary)); border-color: hsl(var(--primary)); }
  input[type="checkbox"]:checked::after {

  input[type="checkbox"]:focus-visible { outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.25); }

  input[type="range"]::-moz-range-thumb {

    background-repeat: no-repeat; background-position: right 8px center; background-size: 10px 6px;

  /* MapLibre's zoom/compass icons are baked as dark-gray (#333) SVG data-URIs with no

  .maplibregl-ctrl-group { background: transparent !important; box-shadow: none !important; }

  .maplibregl-ctrl-group button:hover { background-color: hsl(var(--foreground) / 0.06) !important; }

  @media (prefers-color-scheme: dark) {

  }
  :root[data-theme="dark"] .maplibregl-ctrl-icon { filter: invert(1) brightness(1.2); }

  #compare-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }

<script type="module">
"use strict";

import { ORIGINAL_KEY, buildOriginalStyle, buildThemeStyle, loadOptions, splitMergedStyle, prepareForRender } from "./assets/styles.js";
import { Dropdown } from "./assets/dropdown.js";
import { ColorPickerPopover } from "./assets/colorpicker.js";

const colorPicker = new ColorPickerPopover();

const CENTER = [-111.891, 40.761]; // Salt Lake City
const ZOOM = 10;
const DEFAULT_TEMPLATE = ORIGINAL_KEY; // "Lite" - UGRC's own live basemap

// The 3 services a built-in template's merged style is made of - the layer list is an accordion
// over these, one open at a time (STYLE_EDITOR_PLAN.md §6). An uploaded style has no such split
// and falls back to a flat list. This is display order only, top -> bottom in the sidebar, and
// deliberately the REVERSE of mergeStyles()'s bottom -> top paint order (LiteLabels paints on top
// of everything, so it's listed first here) - a "layers panel" convention (Photoshop/Figma/etc.
// list the topmost-drawn layer first), independent of the actual on-map z-order.
const SERVICE_ORDER = ["LiteLabels", "LiteBase", "VectorHillshade"];
const SERVICE_ABBR = { VectorHillshade: "VH", LiteBase: "LB", LiteLabels: "LL" };

// One spec per GL property name this editor knows how to render a typed control for (property
// names are unique across layer types in the style spec, e.g. "line-width" can't appear on a fill
// layer, so no per-type table is needed). Range bounds are sized with headroom above the largest
// value actually seen across both committed themes' LiteBase/LiteLabels files, not pulled from the
// formal GL spec (most of these have no hard spec maximum). A property with no entry here - or
// whose current value is an array/object (a data-driven expression, an old-style {stops:[...]}
// function, a font-stack array, etc.) - falls back to an editable raw-JSON field instead of one of
// these controls; see renderPropertyRow().
const PROPERTY_SPECS = {
  "fill-color": { kind: "color" },
  "fill-outline-color": { kind: "color" },
  "line-color": { kind: "color" },
  "circle-color": { kind: "color" },
  "circle-stroke-color": { kind: "color" },
  "icon-color": { kind: "color" },
  "text-color": { kind: "color" },
  "text-halo-color": { kind: "color" },

  "fill-opacity": { kind: "range", min: 0, max: 1, step: 0.01 },
  "line-opacity": { kind: "range", min: 0, max: 1, step: 0.01 },
  "line-width": { kind: "range", min: 0, max: 40, step: 0.1 },
  "line-offset": { kind: "range", min: -20, max: 20, step: 0.1 },
  "circle-radius": { kind: "range", min: 0, max: 20, step: 0.1 },
  "circle-stroke-width": { kind: "range", min: 0, max: 10, step: 0.1 },
  "text-halo-width": { kind: "range", min: 0, max: 5, step: 0.1 },
  "icon-rotate": { kind: "range", min: -180, max: 180, step: 1 },
  "symbol-spacing": { kind: "range", min: 0, max: 2000, step: 1 },
  "text-letter-spacing": { kind: "range", min: -2, max: 5, step: 0.01 },
  "text-size": { kind: "range", min: 0, max: 50, step: 0.5 },

  "line-cap": { kind: "enum", values: ["butt", "round", "square"] },
  "line-join": { kind: "enum", values: ["bevel", "round", "miter"] },
  "icon-rotation-alignment": { kind: "enum", values: ["map", "viewport", "auto"] },
  "text-rotation-alignment": { kind: "enum", values: ["map", "viewport", "auto"] },
  "symbol-placement": { kind: "enum", values: ["point", "line", "line-center"] },
  "text-justify": { kind: "enum", values: ["auto", "left", "center", "right"] },
  "text-anchor": {
    kind: "enum",
    values: ["center", "left", "right", "top", "bottom", "top-left", "top-right", "bottom-left", "bottom-right"],
  },

  "icon-allow-overlap": { kind: "boolean" },
  "icon-keep-upright": { kind: "boolean" },
  "text-allow-overlap": { kind: "boolean" },
  "text-optional": { kind: "boolean" },

  "text-field": { kind: "string" },
  "icon-image": { kind: "string" },
};

/** Parses a MapLibre color VALUE (not a full expression) into {hex, alpha}, or null if it isn't a
 * plain hex/rgb(a) string this editor knows how to round-trip (a named color like "steelblue", an
 * hsl() string, or a data-driven expression array all return null - those fall back to a plain
 * text field with no swatch/alpha slider, per the raw-JSON-fallback gap noted in the plan). */
function parseColor(value) {
  if (typeof value !== "string") return null;
  const hex6 = value.match(/^#([0-9a-f]{6})$/i);
  if (hex6) return { hex: `#${hex6[1]}`, alpha: 1 };
  const hex8 = value.match(/^#([0-9a-f]{6})([0-9a-f]{2})$/i);
  if (hex8) return { hex: `#${hex8[1]}`, alpha: parseInt(hex8[2], 16) / 255 };
  const hex3 = value.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i);
  if (hex3) return { hex: `#${hex3[1]}${hex3[1]}${hex3[2]}${hex3[2]}${hex3[3]}${hex3[3]}`, alpha: 1 };
  const rgb = value.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)$/i);
  if (rgb) {
    const toHex = (n) => Number(n).toString(16).padStart(2, "0");
    return {
      hex: `#${toHex(rgb[1])}${toHex(rgb[2])}${toHex(rgb[3])}`,
      alpha: rgb[4] !== undefined ? Number(rgb[4]) : 1,
    };
  }
  return null;
}

function formatColor(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return alpha >= 1 ? hex : `rgba(${r}, ${g}, ${b}, ${Math.round(alpha * 100) / 100})`;
}

function slugify(label) {
  return label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "style";
}

function downloadJson(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// A crash/reload safety net only (STYLE_EDITOR_PLAN.md §10) - never presented as an alternative to
// actually downloading a file, which stays the only real "save." One slot: a later draft always
// replaces an earlier one, matching this editor's single `current` build. Wrapped in try/catch
// throughout since localStorage can throw (private browsing, disabled site data, quota) and losing
// the safety net silently is the only acceptable failure mode here - never a crash.
const DRAFT_KEY = "ugrc-editor-draft-v1";

function saveDraftNow(current) {
  if (!current) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      templateKey: current.templateKey || null,
      label: current.label,
      style: current.style,
      serviceOriginals: current.serviceOriginals || null,
      savedAt: Date.now(),
    }));
  } catch (err) {
    console.warn("[editor] couldn't save draft to localStorage:", err);
  }
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    console.warn("[editor] couldn't read draft from localStorage:", err);
    return null;
  }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch { /* nothing to clean up if this throws */ }
}

// Theme toggle - independent of the editor state above, so wired up immediately rather than
// inside main()'s async init. The actual token values live in <style>; this only ever sets or
// clears the data-theme override attribute the FOUC-prevention script in <head> also reads.
const THEME_KEY = "ugrc-theme";

function effectiveTheme() {
  const explicit = document.documentElement.getAttribute("data-theme");
  if (explicit) return explicit;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function applyThemeIcon() {
  const dark = effectiveTheme() === "dark";
  document.getElementById("theme-icon-sun").hidden = !dark; // clicking shows "switch to light"
  document.getElementById("theme-icon-moon").hidden = dark; // clicking shows "switch to dark"
}

document.getElementById("theme-toggle-btn").addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch { /* falls back to session-only */ }
  applyThemeIcon();
});
applyThemeIcon();
// If there's no explicit saved preference, keep the icon in sync when the OS setting itself
// changes while the page is open (an explicit choice - `data-theme` set - overrides this).
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (!document.documentElement.getAttribute("data-theme")) applyThemeIcon();
});

async function main() {
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const templatePick = new Dropdown(document.getElementById("template-dd"));
  const layerListEl = document.getElementById("layer-list");
  const layerSearchEl = document.getElementById("layer-search");
  const propBodyEl = document.getElementById("prop-body");
  const changedBadgeEl = document.getElementById("changed-badge");
  const download3Btn = document.getElementById("download-3-btn");
  const downloadCombinedBtn = document.getElementById("download-combined-btn");
  const compareToggleBtn = document.getElementById("compare-toggle-btn");
  const mainEl = document.querySelector("main");
  const compareViewEl = document.getElementById("compare-view");
  const compareLeftPick = new Dropdown(document.getElementById("compare-left-dd"));
  const compareRightPick = new Dropdown(document.getElementById("compare-right-dd"));

  const map = new maplibregl.Map({
    container: "map",
    style: { version: 8, sources: {}, layers: [] },
    center: CENTER, zoom: ZOOM, attributionControl: false,
  });
  map.addControl(new maplibregl.NavigationControl(), "top-right");
  map.on("error", (e) => console.error("[editor] MapLibre error:", e && e.error));

  // Mutable editor state. `current.style` is the live, possibly-edited merged style (the same
  // object handed to the map); `pristineLayersById` is a deep-copy snapshot of how it looked right
  // after loading, keyed by layer id, used for per-layer reset and the "changed" diff.
  let options = null;
  let current = null; // { style, serviceOriginals, label }
  let pristineLayersById = null;
  let pristineOrder = null; // layer ids in their as-loaded order, for resetAll() and orderChanged
  let selectedLayerId = null;
  let openService = "LiteBase"; // which accordion section is expanded; null = none
  let openGroups = new Set(); // groupKey(service, path) values for manually-expanded nested groups
  let draggingId = null;
  let draggingService = null;
  // Ids of layers currently differing from their pristine snapshot. Tracked incrementally (one
  // comparison per edit) rather than re-diffing all ~570 merged layers on every slider "input"
  // event, which fires continuously while dragging and would otherwise visibly stutter.
  let changedIds = new Set();
  // Reordering doesn't change any single layer's own JSON, so it wouldn't show up in changedIds -
  // tracked separately, set by reorderWithinService().
  let orderChanged = false;
  // The most recent upload's ORIGINAL parsed content, kept distinct from `current.style` (which
  // keeps mutating as edits happen) so compare mode's "Your upload" option always means the file
  // as uploaded, while "Current edit" means the live in-progress state - see loadUploadedFile().
  let uploadedBuild = null; // { style, label }
  let compareInitialized = false;
  let compareBefore = null, compareAfter = null;
  let compareOpts = null;
  const compareStyleCache = new Map(); // template key -> render-ready style (not for the two live keys)
  let draftSaveTimer = null;

  function setStatus(msg) {
    if (msg == null) { statusEl.hidden = true; return; }
    statusEl.hidden = false;
    statusText.textContent = msg;
  }

  function snapshotPristine() {
    pristineLayersById = new Map(current.style.layers.map((ly) => [ly.id, JSON.parse(JSON.stringify(ly))]));
    pristineOrder = current.style.layers.map((ly) => ly.id);
    changedIds = new Set();
    orderChanged = false;
  }

  function markLayerChecked(layer) {
    const pristine = pristineLayersById && pristineLayersById.get(layer.id);
    const changed = !pristine || JSON.stringify(layer) !== JSON.stringify(pristine);
    if (changed) changedIds.add(layer.id); else changedIds.delete(layer.id);
    updateChangedBadge();
    // Debounced: a dragged slider fires many edits per second, but the draft only needs to be
    // roughly current, not updated on every single one of them.
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(() => saveDraftNow(current), 1000);
  }

  function hasUnsavedEdits() {
    return changedIds.size > 0 || orderChanged;
  }

  function updateChangedBadge() {
    const parts = [];
    if (changedIds.size > 0) parts.push(`${changedIds.size} layer${changedIds.size === 1 ? "" : "s"} changed`);
    if (orderChanged) parts.push("reordered");
    changedBadgeEl.textContent = parts.join(", ");
  }

  function dominantSwatch(layer) {
    for (const p of Object.keys(layer.paint || {})) {
      if (!PROPERTY_SPECS[p] || PROPERTY_SPECS[p].kind !== "color") continue;
      const parsed = parseColor(layer.paint[p]);
      if (parsed) return parsed.hex;
    }
    return null;
  }

  function emptyMessage(text) {
    const empty = document.createElement("div");
    empty.id = "layer-empty";
    empty.textContent = text;
    return empty;
  }

  /** A style with a known 3-service split (a built-in template) renders as an accordion, one
   * service open at a time, so the working set stays manageable (LiteBase alone runs to several
   * hundred layers - see STYLE_EDITOR_PLAN.md §6). Typing a filter auto-expands every section with
   * a match instead of requiring the right one to already be open. A style with no service split
   * (an upload) has no sections to group by and falls back to one flat list. */
  function renderLayerList() {
    const filter = layerSearchEl.value.trim().toLowerCase();
    layerListEl.innerHTML = "";
    const layers = current ? current.style.layers : [];
    if (layers.length === 0) {
      layerListEl.appendChild(emptyMessage("Nothing loaded yet."));
      return;
    }
    if (!current.serviceOriginals) {
      renderFlatList(layers, filter);
      return;
    }
    let anyMatch = false;
    for (const service of SERVICE_ORDER) {
      const inService = layers.filter((ly) => ly.metadata && ly.metadata["ugrc:service"] === service);
      if (inService.length === 0) continue;
      const tree = buildTree(inService);
      const matchCount = countMatches(tree, filter);
      if (matchCount > 0) anyMatch = true;
      const isOpen = filter ? matchCount > 0 : service === openService;
      layerListEl.appendChild(renderServiceSection(service, inService.length, tree, isOpen, filter));
    }
    if (filter && !anyMatch) layerListEl.appendChild(emptyMessage("No layers match that filter."));
  }

  function renderFlatList(layers, filter) {
    const matches = layers.filter((ly) => !filter || ly.id.toLowerCase().includes(filter));
    if (matches.length === 0) {
      layerListEl.appendChild(emptyMessage("No layers match that filter."));
      return;
    }
    for (const ly of matches) layerListEl.appendChild(renderLayerRow(ly, null, ly.id));
  }

  /** Builds a tree from each layer's id path, e.g. "Base/PARKS & REC/Cemeteries_Poly" - the
   * leading segment (the service's own id prefix: "Base"/"Labels"/"Hillshade", always the same one
   * value for every layer in that service) is dropped since the service's accordion header already
   * says as much; each remaining segment becomes a nested group, so "PARKS & REC" and
   * "Utah Parks And Monuments" get their own (sub-)accordion sections rather than one flat list per
   * service. A layer whose id has no further segments (e.g. "Base/WesternStates") is a bare leaf
   * directly under the service, not inside any group. */
  function buildTree(layers) {
    const root = { children: new Map(), layers: [] };
    for (const ly of layers) {
      const parts = ly.id.split("/").slice(1);
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const seg = parts[i];
        let child = node.children.get(seg);
        if (!child) { child = { children: new Map(), layers: [] }; node.children.set(seg, child); }
        node = child;
      }
      node.layers.push(ly);
    }
    return root;
  }

  function countMatches(node, filter) {
    let n = 0;
    for (const ly of node.layers) if (!filter || ly.id.toLowerCase().includes(filter)) n++;
    for (const child of node.children.values()) n += countMatches(child, filter);
    return n;
  }

  function groupKey(service, path) {
    return `${service}::${path}`;
  }

  /** Renders one tree node's own bare leaves, then a (sub-)accordion section per child group.
   * `pathSegments` are this node's segments relative to its service (e.g. ["PARKS & REC"]),
   * used both as each leaf row's shortened display label (the group name is already visible in
   * its own header, so repeating it per row would be noise) and as the key tracking which nested
   * groups are manually expanded. */
  function renderNodeChildren(node, pathSegments, service, filter, container) {
    for (const ly of node.layers) {
      if (filter && !ly.id.toLowerCase().includes(filter)) continue;
      const tail = ly.id.split("/").slice(1 + pathSegments.length).join("/");
      container.appendChild(renderLayerRow(ly, service, tail || ly.id));
    }
    for (const [name, child] of node.children) {
      const childPath = [...pathSegments, name];
      const matchCount = countMatches(child, filter);
      if (filter && matchCount === 0) continue;
      const key = groupKey(service, childPath.join("/"));
      const isOpen = filter ? matchCount > 0 : openGroups.has(key);
      container.appendChild(renderGroupSection(service, childPath, name, child, matchCount, isOpen, filter));
    }
  }

  function renderGroupSection(service, pathSegments, name, node, count, isOpen, filter) {
    const section = document.createElement("div");
    section.className = "group-section";

    const header = document.createElement("button");
    header.type = "button";
    header.className = "group-header";
    header.setAttribute("aria-expanded", String(isOpen));
    const chevron = document.createElement("span");
    chevron.className = "group-chevron";
    chevron.textContent = isOpen ? "▾" : "▸";
    const label = document.createElement("span");
    label.className = "group-name";
    label.textContent = name;
    const countEl = document.createElement("span");
    countEl.className = "group-count";
    countEl.textContent = String(count);
    header.append(chevron, label, countEl);
    header.addEventListener("click", () => {
      const key = groupKey(service, pathSegments.join("/"));
      if (openGroups.has(key)) openGroups.delete(key); else openGroups.add(key);
      renderLayerList();
    });
    section.appendChild(header);

    const body = document.createElement("div");
    body.className = "group-body";
    body.hidden = !isOpen;
    if (isOpen) renderNodeChildren(node, pathSegments, service, filter, body);
    section.appendChild(body);
    return section;
  }

  function renderServiceSection(service, totalCount, tree, isOpen, filter) {
    const section = document.createElement("div");
    section.className = "service-section";

    const header = document.createElement("button");
    header.type = "button";
    header.className = "service-header";
    header.setAttribute("aria-expanded", String(isOpen));
    const chevron = document.createElement("span");
    chevron.className = "service-chevron";
    chevron.textContent = isOpen ? "▾" : "▸";
    const name = document.createElement("span");
    name.className = "service-name";
    name.textContent = service;
    const count = document.createElement("span");
    count.className = "service-count";
    count.textContent = String(totalCount);
    header.append(chevron, name, count);
    // Inert while a filter is active (isOpen then follows matches, not openService) - clearing
    // the filter first is how you get manual accordion control back.
    header.addEventListener("click", () => {
      openService = openService === service ? null : service;
      renderLayerList();
    });
    section.appendChild(header);

    const body = document.createElement("div");
    body.className = "service-body";
    body.hidden = !isOpen;
    if (isOpen) renderNodeChildren(tree, [], service, filter, body);
    section.appendChild(body);
    return section;
  }

  /** `service` is the accordion section this row lives in - drag-to-reorder is wired up only when
   * it's given (STYLE_EDITOR_PLAN.md §6: reordering is scoped to within one service, since a
   * cross-service order can't survive the 3-file export). Passed null for the flat/upload list,
   * which also has no per-row service tag since there's no section header to make it redundant.
   * `displayLabel` is what the row's text shows (the id tail within its group, or the full id in
   * the flat list); search filtering and selection still always key off the layer's real `ly.id`. */
  function renderLayerRow(ly, service, displayLabel) {
    const row = document.createElement("div");
    row.className = "layer-row" + (ly.id === selectedLayerId ? " is-selected" : "");
    row.setAttribute("role", "button");
    row.tabIndex = 0;

    if (service) {
      row.draggable = true;
      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.setAttribute("aria-hidden", "true");
      handle.textContent = "⠿";
      row.appendChild(handle);
      row.addEventListener("dragstart", (e) => {
        draggingId = ly.id;
        draggingService = service;
        e.dataTransfer.effectAllowed = "move";
        row.classList.add("is-dragging");
      });
      row.addEventListener("dragend", () => {
        row.classList.remove("is-dragging");
        draggingId = null;
        draggingService = null;
      });
      row.addEventListener("dragover", (e) => {
        if (draggingService !== service) return;
        e.preventDefault();
        row.classList.add("drag-over");
      });
      row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
      row.addEventListener("drop", (e) => {
        e.preventDefault();
        row.classList.remove("drag-over");
        if (draggingService !== service || draggingId == null || draggingId === ly.id) return;
        reorderWithinService(service, draggingId, ly.id);
      });
    }

    const visible = document.createElement("input");
    visible.type = "checkbox";
    visible.title = "Toggle visibility";
    visible.checked = !(ly.layout && ly.layout.visibility === "none");
    visible.addEventListener("click", (e) => e.stopPropagation());
    visible.addEventListener("change", () => {
      ly.layout = ly.layout || {};
      ly.layout.visibility = visible.checked ? "visible" : "none";
      map.setLayoutProperty(ly.id, "visibility", ly.layout.visibility);
      idEl.classList.toggle("is-hidden-layer", !visible.checked);
      markLayerChecked(ly);
    });
    row.appendChild(visible);

    if (!service) {
      const tagService = ly.metadata && ly.metadata["ugrc:service"];
      if (tagService) {
        const tag = document.createElement("span");
        tag.className = "layer-tag";
        tag.textContent = SERVICE_ABBR[tagService] || tagService.slice(0, 2).toUpperCase();
        row.appendChild(tag);
      }
    }

    const swatch = dominantSwatch(ly);
    if (swatch) {
      const sw = document.createElement("span");
      sw.className = "layer-swatch";
      sw.style.background = swatch;
      row.appendChild(sw);
    }

    const idEl = document.createElement("span");
    idEl.className = "layer-id" + (!visible.checked ? " is-hidden-layer" : "");
    idEl.textContent = displayLabel;
    idEl.title = ly.id;
    row.appendChild(idEl);

    row.addEventListener("click", () => selectLayer(ly.id));
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectLayer(ly.id); }
    });
    return row;
  }

  /** Each service's layers occupy one contiguous run of `current.style.layers` (mergeStyles()
   * appends a whole service's layers at a time, and no feature here adds/removes layers to break
   * that up) - so reordering within a service is just finding that run's bounds, reordering the
   * slice, and splicing it back into the same bounds. */
  function reorderWithinService(service, draggedId, targetId) {
    const layers = current.style.layers;
    const indices = [];
    layers.forEach((ly, i) => { if (ly.metadata && ly.metadata["ugrc:service"] === service) indices.push(i); });
    if (indices.length === 0) return;
    const start = indices[0], end = indices[indices.length - 1] + 1;
    const sub = layers.slice(start, end);
    const fromIdx = sub.findIndex((ly) => ly.id === draggedId);
    const toIdx = sub.findIndex((ly) => ly.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = sub.splice(fromIdx, 1);
    sub.splice(toIdx, 0, moved);
    layers.splice(start, end - start, ...sub);
    orderChanged = layers.map((ly) => ly.id).join("␀") !== pristineOrder.join("␀");
    map.setStyle(prepareForRender(current.style));
    renderLayerList();
    renderPropertyPanel();
    updateChangedBadge();
    saveDraftNow(current);
  }

  function selectLayer(id) {
    selectedLayerId = id;
    const ly = current && current.style.layers.find((l) => l.id === id);
    const service = ly && ly.metadata && ly.metadata["ugrc:service"];
    if (service) {
      openService = service; // keep the section open if the search box is cleared next
      // Same for every nested group the layer lives in, e.g. selecting a search hit under
      // Base/PARKS & REC/... expands "PARKS & REC" so it's still visible once the filter clears.
      const parts = ly.id.split("/").slice(1);
      for (let i = 0; i < parts.length - 1; i++) {
        openGroups.add(groupKey(service, parts.slice(0, i + 1).join("/")));
      }
    }
    renderLayerList();
    renderPropertyPanel();
  }

  function applyPropertyEdit(layer, kind, prop, value) {
    const bucket = kind === "layout" ? (layer.layout = layer.layout || {}) : (layer.paint = layer.paint || {});
    bucket[prop] = value;
    if (kind === "layout") map.setLayoutProperty(layer.id, prop, value);
    else map.setPaintProperty(layer.id, prop, value);
    markLayerChecked(layer);
  }

  function formatNumber(value, step) {
    const decimals = (String(step).split(".")[1] || "").length;
    return value.toFixed(decimals);
  }

  function propRowLabel(prop) {
    const label = document.createElement("label");
    label.textContent = prop;
    return label;
  }

  /** A shadcn/ui-style swatch trigger (see docs/assets/colorpicker.js) instead of the OS-native
   * <input type=color> dialog this used to open - gives a 2D saturation/value square, a hue
   * slider, and a checkerboard-based alpha slider (tinted to the current color, not a generic
   * fade, so it's unambiguous that it controls transparency) directly in our own UI, plus an
   * eyedropper where the browser supports it. The hex/rgba text field alongside it still works
   * exactly as before for typing an exact value. */
  function renderColorRow(layer, kind, prop) {
    const wrap = document.createElement("div");
    wrap.className = "prop-row";
    wrap.appendChild(propRowLabel(prop));

    const bucket = kind === "layout" ? layer.layout : layer.paint;
    const value = bucket[prop];
    const parsed = parseColor(value) || { hex: "#888888", alpha: 1 };
    const colorRow = document.createElement("div");
    colorRow.className = "color-row";

    const swatchBtn = document.createElement("button");
    swatchBtn.type = "button";
    swatchBtn.className = "color-swatch-btn";
    swatchBtn.setAttribute("aria-label", `Edit ${prop}`);
    const swatchFill = document.createElement("span");
    swatchFill.className = "color-swatch-fill";
    swatchBtn.appendChild(swatchFill);

    const text = document.createElement("input");
    text.type = "text";
    text.value = value != null ? String(value) : "";
    colorRow.append(swatchBtn, text);
    wrap.appendChild(colorRow);

    const updateSwatch = (hex, alpha) => { swatchFill.style.background = formatColor(hex, alpha); };
    updateSwatch(parsed.hex, parsed.alpha);

    const commit = (formatted) => {
      text.value = formatted;
      const reparsed = parseColor(formatted);
      if (reparsed) updateSwatch(reparsed.hex, reparsed.alpha);
      applyPropertyEdit(layer, kind, prop, formatted);
      refreshRawJson(layer);
    };

    swatchBtn.addEventListener("click", () => {
      // Re-read from the live layer rather than the `parsed` captured at render time: an earlier
      // edit (from this row or the popover) doesn't force a full property-panel re-render, so a
      // stale closure here would reopen the popover showing the color from before that edit.
      const current = parseColor(bucket[prop]) || { hex: "#888888", alpha: 1 };
      colorPicker.open(swatchBtn, current.hex, current.alpha, commit);
    });
    text.addEventListener("change", () => {
      const reparsed = parseColor(text.value);
      if (!reparsed) { text.value = value != null ? String(value) : ""; return; }
      updateSwatch(reparsed.hex, reparsed.alpha);
      applyPropertyEdit(layer, kind, prop, text.value);
      refreshRawJson(layer);
    });
    return wrap;
  }

  function renderRangeRow(layer, kind, prop, spec) {
    const wrap = document.createElement("div");
    wrap.className = "prop-row";
    wrap.appendChild(propRowLabel(prop));

    const bucket = kind === "layout" ? layer.layout : layer.paint;
    const raw = bucket[prop];
    const initial = Math.min(Math.max(typeof raw === "number" ? raw : spec.min, spec.min), spec.max);

    const numRow = document.createElement("div");
    numRow.className = "number-row";
    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = String(spec.min); slider.max = String(spec.max); slider.step = String(spec.step);
    slider.value = String(initial);
    const out = document.createElement("output");
    out.textContent = formatNumber(initial, spec.step);
    numRow.append(slider, out);
    wrap.appendChild(numRow);

    slider.addEventListener("input", () => {
      const v = Number(slider.value);
      out.textContent = formatNumber(v, spec.step);
      applyPropertyEdit(layer, kind, prop, v);
      refreshRawJson(layer);
    });
    return wrap;
  }

  function renderEnumRow(layer, kind, prop, spec) {
    const wrap = document.createElement("div");
    wrap.className = "prop-row";
    wrap.appendChild(propRowLabel(prop));

    const bucket = kind === "layout" ? layer.layout : layer.paint;
    const value = bucket[prop];
    const select = document.createElement("select");
    select.className = "prop-select";
    for (const v of spec.values) {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      if (v === value) opt.selected = true;
      select.appendChild(opt);
    }
    select.addEventListener("change", () => {
      applyPropertyEdit(layer, kind, prop, select.value);
      refreshRawJson(layer);
    });
    wrap.appendChild(select);
    return wrap;
  }

  function renderBooleanRow(layer, kind, prop) {
    const wrap = document.createElement("div");
    wrap.className = "prop-row";
    const label = document.createElement("label");
    label.className = "checkbox-label";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    const bucket = kind === "layout" ? layer.layout : layer.paint;
    checkbox.checked = !!bucket[prop];
    checkbox.addEventListener("change", () => {
      applyPropertyEdit(layer, kind, prop, checkbox.checked);
      refreshRawJson(layer);
    });
    label.append(checkbox, document.createTextNode(" " + prop));
    wrap.appendChild(label);
    return wrap;
  }

  function renderStringRow(layer, kind, prop) {
    const wrap = document.createElement("div");
    wrap.className = "prop-row";
    wrap.appendChild(propRowLabel(prop));

    const bucket = kind === "layout" ? layer.layout : layer.paint;
    const value = bucket[prop];
    const input = document.createElement("input");
    input.type = "text";
    input.className = "prop-text-input";
    input.value = value != null ? String(value) : "";
    input.addEventListener("change", () => {
      applyPropertyEdit(layer, kind, prop, input.value);
      refreshRawJson(layer);
    });
    wrap.appendChild(input);
    return wrap;
  }

  /** The fallback for anything without a spec above, or whose value is an array/object (a
   * data-driven expression, an old-style {stops:[...]} function, a font-stack array) - a plain
   * editable JSON field rather than a read-only note, per STYLE_EDITOR_PLAN.md §7's "raw-JSON
   * textarea for that single property, parsed/validated on blur." */
  function renderRawPropertyRow(layer, kind, prop) {
    const wrap = document.createElement("div");
    wrap.className = "prop-row";
    wrap.appendChild(propRowLabel(prop));

    const bucket = kind === "layout" ? layer.layout : layer.paint;
    const textarea = document.createElement("textarea");
    textarea.className = "raw-prop-input";
    textarea.rows = 2;
    textarea.value = JSON.stringify(bucket[prop]);
    const err = document.createElement("div");
    err.className = "raw-prop-error";
    err.hidden = true;
    textarea.addEventListener("blur", () => {
      let value;
      try { value = JSON.parse(textarea.value); }
      catch { err.textContent = "Invalid JSON - not applied."; err.hidden = false; return; }
      err.hidden = true;
      applyPropertyEdit(layer, kind, prop, value);
      refreshRawJson(layer);
    });
    wrap.append(textarea, err);
    return wrap;
  }

  function renderPropertyRow(layer, kind, prop) {
    const bucket = kind === "layout" ? layer.layout : layer.paint;
    const value = bucket[prop];
    if (value !== null && typeof value === "object") return renderRawPropertyRow(layer, kind, prop);
    const spec = PROPERTY_SPECS[prop];
    if (!spec) return renderRawPropertyRow(layer, kind, prop);
    if (spec.kind === "color") return renderColorRow(layer, kind, prop);
    if (spec.kind === "range") return renderRangeRow(layer, kind, prop, spec);
    if (spec.kind === "enum") return renderEnumRow(layer, kind, prop, spec);
    if (spec.kind === "boolean") return renderBooleanRow(layer, kind, prop);
    if (spec.kind === "string") return renderStringRow(layer, kind, prop);
    return renderRawPropertyRow(layer, kind, prop);
  }

  function collectEditableProps(layer) {
    const out = [];
    for (const prop of Object.keys(layer.paint || {})) out.push({ prop, kind: "paint" });
    for (const prop of Object.keys(layer.layout || {})) {
      if (prop === "visibility") continue; // shown via the layer list's checkbox instead
      out.push({ prop, kind: "layout" });
    }
    return out;
  }

  /** All the sample filters in both committed themes are the plain `["==", field, value]` /
   * `["!=", field, value]` shape - rendered as a small operator/field/value builder. Anything else
   * (an "all"/"any" combinator, or no filter at all is just omitted) falls back to raw JSON. */
  function renderFilterSection(layer) {
    const section = document.createElement("div");
    section.className = "prop-section";
    const h = document.createElement("h3");
    h.className = "prop-section-title";
    h.textContent = "Filter";
    section.appendChild(h);

    if (layer.filter === undefined) {
      const note = document.createElement("p");
      note.className = "prop-empty";
      note.textContent = "No filter on this layer.";
      section.appendChild(note);
      return section;
    }

    const filter = layer.filter;
    const isSimple = Array.isArray(filter) && filter.length === 3
      && (filter[0] === "==" || filter[0] === "!=") && typeof filter[1] === "string";
    if (!isSimple) {
      const textarea = document.createElement("textarea");
      textarea.className = "raw-prop-input";
      textarea.rows = 3;
      textarea.value = JSON.stringify(filter);
      const err = document.createElement("div");
      err.className = "raw-prop-error";
      err.hidden = true;
      textarea.addEventListener("blur", () => {
        let value;
        try { value = JSON.parse(textarea.value); }
        catch { err.textContent = "Invalid JSON - not applied."; err.hidden = false; return; }
        if (!Array.isArray(value)) { err.textContent = "A filter must be an array."; err.hidden = false; return; }
        err.hidden = true;
        layer.filter = value;
        map.setFilter(layer.id, value);
        markLayerChecked(layer);
        refreshRawJson(layer);
      });
      section.append(textarea, err);
      return section;
    }

    const row = document.createElement("div");
    row.className = "filter-row";
    const opSelect = document.createElement("select");
    opSelect.className = "prop-select";
    for (const op of ["==", "!="]) {
      const opt = document.createElement("option");
      opt.value = op; opt.textContent = op;
      if (op === filter[0]) opt.selected = true;
      opSelect.appendChild(opt);
    }
    const fieldInput = document.createElement("input");
    fieldInput.type = "text";
    fieldInput.className = "prop-text-input filter-field";
    fieldInput.value = filter[1];
    const valueInput = document.createElement("input");
    valueInput.type = "text";
    valueInput.className = "prop-text-input filter-value";
    valueInput.value = String(filter[2]);
    row.append(opSelect, fieldInput, valueInput);
    section.appendChild(row);

    const commit = () => {
      const raw = valueInput.value.trim();
      const num = Number(raw);
      const value = raw !== "" && !Number.isNaN(num) ? num : raw;
      layer.filter = [opSelect.value, fieldInput.value, value];
      map.setFilter(layer.id, layer.filter);
      markLayerChecked(layer);
      refreshRawJson(layer);
    };
    opSelect.addEventListener("change", commit);
    fieldInput.addEventListener("change", commit);
    valueInput.addEventListener("change", commit);
    return section;
  }

  function renderZoomSection(layer) {
    const section = document.createElement("div");
    section.className = "prop-section";
    const h = document.createElement("h3");
    h.className = "prop-section-title";
    h.textContent = "Zoom range";
    section.appendChild(h);

    const row = document.createElement("div");
    row.className = "zoom-row";
    const minLabel = document.createElement("label");
    minLabel.textContent = "Min";
    const minInput = document.createElement("input");
    minInput.type = "number";
    minInput.min = "0"; minInput.max = "24"; minInput.step = "1";
    minInput.className = "prop-text-input zoom-input";
    minInput.placeholder = "0";
    minInput.value = layer.minzoom != null ? String(layer.minzoom) : "";

    const maxLabel = document.createElement("label");
    maxLabel.textContent = "Max";
    const maxInput = document.createElement("input");
    maxInput.type = "number";
    maxInput.min = "0"; maxInput.max = "24"; maxInput.step = "1";
    maxInput.className = "prop-text-input zoom-input";
    maxInput.placeholder = "24";
    maxInput.value = layer.maxzoom != null ? String(layer.maxzoom) : "";

    const commit = () => {
      if (minInput.value === "") delete layer.minzoom; else layer.minzoom = Number(minInput.value);
      if (maxInput.value === "") delete layer.maxzoom; else layer.maxzoom = Number(maxInput.value);
      map.setLayerZoomRange(layer.id, layer.minzoom ?? 0, layer.maxzoom ?? 24);
      markLayerChecked(layer);
      refreshRawJson(layer);
    };
    minInput.addEventListener("change", commit);
    maxInput.addEventListener("change", commit);

    row.append(minLabel, minInput, maxLabel, maxInput);
    section.appendChild(row);
    return section;
  }

  function refreshRawJson(layer) {
    const pre = propBodyEl.querySelector("#raw-json-pre");
    if (pre) pre.textContent = JSON.stringify(layer, null, 2);
  }

  function renderPropertyPanel() {
    propBodyEl.innerHTML = "";
    const layer = current && current.style.layers.find((ly) => ly.id === selectedLayerId);
    if (!layer) {
      propBodyEl.innerHTML = '<p class="prop-empty">Select a layer on the left to edit it.</p>';
      return;
    }
    const heading = document.createElement("p");
    heading.className = "prop-layer-id";
    heading.textContent = layer.id;
    propBodyEl.appendChild(heading);

    const typeLine = document.createElement("p");
    typeLine.className = "prop-layer-type";
    const service = layer.metadata && layer.metadata["ugrc:service"];
    typeLine.textContent = `${layer.type}${service ? ` · ${service}` : ""}`;
    propBodyEl.appendChild(typeLine);

    const entries = collectEditableProps(layer);
    if (entries.length === 0) {
      const none = document.createElement("p");
      none.className = "prop-empty";
      none.textContent = "No editable paint or layout properties on this layer.";
      propBodyEl.appendChild(none);
    }
    for (const { prop, kind } of entries) propBodyEl.appendChild(renderPropertyRow(layer, kind, prop));

    propBodyEl.appendChild(renderFilterSection(layer));
    propBodyEl.appendChild(renderZoomSection(layer));

    const actions = document.createElement("div");
    actions.className = "prop-actions";
    const resetBtn = document.createElement("button");
    resetBtn.className = "btn";
    resetBtn.type = "button";
    resetBtn.textContent = "Reset this layer";
    resetBtn.addEventListener("click", () => resetLayer(layer.id));
    actions.appendChild(resetBtn);
    propBodyEl.appendChild(actions);

    const details = document.createElement("details");
    details.className = "raw-json";
    const summary = document.createElement("summary");
    summary.textContent = "Layer JSON (read-only)";
    const pre = document.createElement("pre");
    pre.id = "raw-json-pre";
    pre.textContent = JSON.stringify(layer, null, 2);
    details.append(summary, pre);
    propBodyEl.appendChild(details);
  }

  // Re-renders the layer list/property panel synchronously right after setStyle: both read only
  // `current.style` (our own tracked object), never the map's internal state, so there's no need
  // to wait for the map's "styledata" event to actually fire before refreshing them.
  function resetLayer(id) {
    const pristine = pristineLayersById && pristineLayersById.get(id);
    if (!pristine) return;
    const idx = current.style.layers.findIndex((ly) => ly.id === id);
    if (idx === -1) return;
    current.style.layers[idx] = JSON.parse(JSON.stringify(pristine));
    changedIds.delete(id);
    map.setStyle(prepareForRender(current.style));
    renderLayerList(); renderPropertyPanel(); updateChangedBadge();
    saveDraftNow(current);
  }

  function resetAll() {
    if (!current || !confirm("Discard all edits and reload the current template?")) return;
    current.style.layers = pristineOrder.map((id) => JSON.parse(JSON.stringify(pristineLayersById.get(id))));
    changedIds.clear();
    orderChanged = false;
    map.setStyle(prepareForRender(current.style));
    renderLayerList(); renderPropertyPanel(); updateChangedBadge();
    saveDraftNow(current);
  }

  async function loadBuild(built, label) {
    current = { style: built.style, serviceOriginals: built.serviceOriginals, label };
    snapshotPristine();
    selectedLayerId = null;
    openGroups = new Set();
    map.setStyle(prepareForRender(current.style));
    download3Btn.disabled = !current.serviceOriginals;
    renderLayerList();
    renderPropertyPanel();
    updateChangedBadge();
    saveDraftNow(current); // keeps the draft's own templateKey/label in sync immediately, not just
                            // on the next debounced edit - narrows the window where a stale draft
                            // from a since-abandoned load could get offered for restore on reload
  }

  async function loadTemplate(key) {
    if (current && key === current.templateKey) return;
    if (hasUnsavedEdits() && !confirm("Discard your current edits and load a different template?")) {
      // current.templateKey is null when the loaded style was an upload, not a listed template -
      // there's no matching dropdown option to revert to, so just restore its label directly.
      if (current.templateKey) templatePick.setValueSilently(current.templateKey);
      else templatePick.label.textContent = current.label;
      return;
    }
    setStatus(`Loading ${options[key].label}…`);
    try {
      const built = key === ORIGINAL_KEY ? await buildOriginalStyle() : await buildThemeStyle(options[key].manifest);
      await loadBuild(built, options[key].label);
      current.templateKey = key;
    } catch (err) {
      console.error(err);
      setStatus("Failed to load: " + err.message);
      return;
    }
    setStatus(null);
  }

  async function loadUploadedFile(file) {
    if (hasUnsavedEdits() && !confirm("Discard your current edits and load this file?")) return;
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      alert("That file isn't valid JSON: " + err.message);
      return;
    }
    if (parsed.version !== 8 || typeof parsed.sources !== "object" || !Array.isArray(parsed.layers)) {
      alert("That doesn't look like a MapLibre style (expected version: 8, sources, and layers).");
      return;
    }
    if (typeof parsed.sprite === "string" && !/^https?:\/\//.test(parsed.sprite)) {
      console.warn("Uploaded style's sprite path looks relative - it may not load correctly.", parsed.sprite);
    }
    // Snapshot the ORIGINAL upload before it's handed to loadBuild (whose current.style becomes
    // this same object, then keeps mutating as edits happen) - compare mode's "Your upload" option
    // should always mean the file as uploaded, distinct from "Current edit" (see compareOptionsList).
    const label = file.name.replace(/\.json$/i, "");
    uploadedBuild = { style: JSON.parse(JSON.stringify(parsed)), label };
    // Uploads have no known 3-service origin (see STYLE_EDITOR_PLAN.md §3) - only the combined
    // single-file download applies, regardless of whether this file was itself exported from here.
    await loadBuild({ style: parsed, serviceOriginals: null }, label);
    current.templateKey = null;
    // No "start from" dropdown option represents "an upload" - just show the filename in the
    // picker without touching its selected-option state, since none of its options actually match.
    templatePick.label.textContent = current.label;
  }

  function downloadCombined() {
    if (!current) return;
    downloadJson(`ugrc-${slugify(current.label)}-edited.json`, current.style);
  }

  function downloadThree() {
    if (!current || !current.serviceOriginals) return;
    const split = splitMergedStyle(current.style.layers, current.serviceOriginals);
    for (const [service, style] of Object.entries(split)) {
      downloadJson(`UGRC_${service}_${slugify(current.label)}-edited.json`, style);
    }
  }

  /** The compare-mode option list: every built-in template/original, plus "Current edit" once
   * something's loaded and "Your upload" once a file's been uploaded this session - reusing the
   * same picker options as the "start from" dropdown wouldn't work since those two are dynamic and
   * session-specific rather than fixed entries from docs/themes.json (STYLE_EDITOR_PLAN.md §9). */
  function compareOptionsList() {
    const opts = { ...options };
    if (current) {
      opts["current-edit"] = {
        label: "Current edit",
        description: `The style as you've edited it so far (started from ${current.label}).`,
      };
    }
    if (uploadedBuild) {
      opts["uploaded"] = { label: uploadedBuild.label, description: "Your uploaded style, as uploaded." };
    }
    return opts;
  }

  /** "current-edit"/"uploaded" always resolve to the live/retained objects (never cached, since
   * they can change or be replaced across a session); built-in templates are cached so re-picking
   * one already seen this session doesn't re-fetch. Everything returned is already render-ready
   * (prepareForRender handles both an upload's possible Esri-shaped sources and a template's
   * already-converted ones as a no-op). */
  async function compareStyleFor(key) {
    if (key === "current-edit") return prepareForRender(current.style);
    if (key === "uploaded") return prepareForRender(uploadedBuild.style);
    if (compareStyleCache.has(key)) return compareStyleCache.get(key);
    const built = key === ORIGINAL_KEY ? await buildOriginalStyle() : await buildThemeStyle(compareOpts[key].manifest);
    const rendered = prepareForRender(built.style);
    compareStyleCache.set(key, rendered);
    return rendered;
  }

  async function enterCompareMode() {
    compareOpts = compareOptionsList();
    compareLeftPick.setOptions(compareOpts);
    compareRightPick.setOptions(compareOpts);
    const keys = Object.keys(compareOpts);
    const leftDefault = current && current.templateKey && current.templateKey in compareOpts ? current.templateKey : keys[0];
    const rightDefault = "current-edit" in compareOpts ? "current-edit" : keys[Math.min(1, keys.length - 1)];
    compareLeftPick.setValueSilently(leftDefault);
    compareRightPick.setValueSilently(rightDefault);

    mainEl.hidden = true;
    compareViewEl.hidden = false;
    compareToggleBtn.textContent = "Back to editor";
    compareToggleBtn.setAttribute("aria-pressed", "true");

    const [leftStyle, rightStyle] = await Promise.all([compareStyleFor(leftDefault), compareStyleFor(rightDefault)]);
    if (!compareInitialized) {
      compareBefore = new maplibregl.Map({
        container: "compare-before", style: leftStyle, center: CENTER, zoom: ZOOM, attributionControl: false,
      });
      compareAfter = new maplibregl.Map({
        container: "compare-after", style: rightStyle, center: CENTER, zoom: ZOOM, attributionControl: false,
      });
      new maplibregl.Compare(compareBefore, compareAfter, "#compare-maps", {});
      for (const [label, m] of [["compare-before", compareBefore], ["compare-after", compareAfter]]) {
        m.on("error", (e) => console.error(`[${label}] MapLibre error:`, e && e.error));
      }
      // map.addControl() mounts a control INSIDE that map's own container, which the compare
      // slider clips to a left- or right-only region - so whichever map it were attached to, the
      // control would disappear past the slider. Instead call the control's onAdd() directly
      // (bypassing addControl's placement) and mount the resulting element on #compare-nav-control,
      // a sibling of both map containers that's never clipped. The two maps are camera-synced, so
      // binding it to "compareAfter" still zooms/pans both.
      const nav = new maplibregl.NavigationControl();
      document.getElementById("compare-nav-control").appendChild(nav.onAdd(compareAfter));
      compareInitialized = true;
    } else {
      compareBefore.setStyle(leftStyle);
      compareAfter.setStyle(rightStyle);
      compareBefore.resize();
      compareAfter.resize();
    }
  }

  function exitCompareMode() {
    mainEl.hidden = false;
    compareViewEl.hidden = true;
    compareToggleBtn.textContent = "Compare";
    compareToggleBtn.setAttribute("aria-pressed", "false");
  }

  templatePick.addEventListener("change", () => loadTemplate(templatePick.value));
  layerSearchEl.addEventListener("input", renderLayerList);
  document.getElementById("upload-btn").addEventListener("click", () => document.getElementById("upload-input").click());
  document.getElementById("upload-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) loadUploadedFile(file);
    e.target.value = "";
  });
  document.getElementById("reset-all-btn").addEventListener("click", resetAll);
  download3Btn.addEventListener("click", downloadThree);
  downloadCombinedBtn.addEventListener("click", downloadCombined);
  compareToggleBtn.addEventListener("click", () => {
    if (compareViewEl.hidden) enterCompareMode(); else exitCompareMode();
  });
  compareLeftPick.addEventListener("change", async () => {
    compareBefore.setStyle(await compareStyleFor(compareLeftPick.value));
  });
  compareRightPick.addEventListener("change", async () => {
    compareAfter.setStyle(await compareStyleFor(compareRightPick.value));
  });
  document.getElementById("compare-swap-btn").addEventListener("click", () => {
    const l = compareLeftPick.value, r = compareRightPick.value;
    if (l === r) return;
    compareLeftPick.value = r;
    compareRightPick.value = l;
  });
  window.addEventListener("beforeunload", (e) => {
    if (hasUnsavedEdits()) { e.preventDefault(); e.returnValue = ""; }
  });

  try {
    setStatus("Loading UGRC's live styles…");
    options = await loadOptions();
    templatePick.setOptions(options);

    const draft = loadDraft();
    if (draft && confirm(`Restore your unsaved draft from ${new Date(draft.savedAt).toLocaleString()} (${draft.label})?`)) {
      // The draft becomes the new pristine baseline (same as loading an upload does) - a "Reset"
      // afterwards reverts to the draft, not all the way back to the original untouched template.
      // Fine for a crash-recovery safety net; picking the template again from the dropdown (with
      // its own discard-edits confirm) is how you'd get back to a truly pristine copy.
      await loadBuild({ style: draft.style, serviceOriginals: draft.serviceOriginals }, draft.label);
      current.templateKey = draft.templateKey;
      if (draft.templateKey) templatePick.setValueSilently(draft.templateKey);
      else templatePick.label.textContent = draft.label;
      if (!draft.templateKey) uploadedBuild = { style: JSON.parse(JSON.stringify(draft.style)), label: draft.label };
      setStatus(null); // loadBuild() itself never touches the status overlay - unlike loadTemplate()
                        // below, which clears it on success; missing this left the "Loading…"
                        // overlay stuck forever after restoring a draft, only clearing once some
                        // later loadTemplate() call (e.g. picking a different style) happened to fire.
    } else {
      if (draft) clearDraft(); // declined - don't keep re-prompting on every future reload
      await loadTemplate(DEFAULT_TEMPLATE in options ? DEFAULT_TEMPLATE : Object.keys(options)[0]);
      // loadTemplate() swallows its own failures (logs + shows "Failed to load…", doesn't rethrow),
      // so `current` can still be null here if the very first load failed - guard it rather than
      // let this throw and stomp that message with a confusing "Cannot read properties of null".
      if (current) templatePick.setValueSilently(current.templateKey); // reflect the initial load; avoid re-dispatching "change"
    }
    compareToggleBtn.disabled = false;
  } catch (err) {
    console.error(err);
    setStatus("Failed to load: " + err.message);
  }
}

main();
</script>
</body>
</html>
