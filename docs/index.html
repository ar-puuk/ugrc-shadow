<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGRC Lite style compare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1013'/%3E%3Cpath d='M50 8a42 42 0 000 84z' fill='%23f2b84b'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23272a31' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css">
<style>
  :root {
    --accent: #f2b84b;
    --accent-2: #6ea8fe;
    --glass-bg: rgba(15, 16, 20, .68);
    --glass-border: rgba(255, 255, 255, .09);
    --text: #f4f5f7;
    --text-dim: #a9adb6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0e10; color: var(--text);
    font: 14px/1.4 "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #maps { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  #before, #after { position: absolute; top: 0; bottom: 0; width: 100%; }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-top-color: rgba(255, 255, 255, .18); /* a faint top highlight, like light catching a glass edge */
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }

  @keyframes fade-down { from { opacity: 0; transform: translateY(-10px); } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } }
  header { animation: fade-down .5s cubic-bezier(.2, .8, .2, 1) both; }
  footer { animation: fade-up .5s cubic-bezier(.2, .8, .2, 1) both; }

  /* header/footer overlay BOTH map halves (they span the full width, the compare slider only
     clips the maps beneath), so both float above everything as their own frosted cards rather
     than a scrim - readable over any basemap regardless of its own brightness. */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center;
    padding: 14px 14px 0;
    pointer-events: none;
  }
  .toolbar {
    pointer-events: auto;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px;
    width: 100%; max-width: 860px;
    padding: 10px 18px;
    border-radius: 14px;
  }
  .brand { margin-right: auto; line-height: 1.2; }
  .brand-row { display: flex; align-items: center; gap: 7px; }
  .brand-dot {
    width: 9px; height: 9px; flex: none; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 8px rgba(242, 184, 75, .55);
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .1px; }
  .brand p { margin: 0; padding-left: 16px; font-size: 11px; font-weight: 500; color: var(--text-dim); }

  .divider { align-self: stretch; min-height: 24px; width: 1px; background: rgba(255, 255, 255, .12); flex: none; }

  /* The two pickers + swap button are visually clustered into one segmented control (a shared
     background/border) rather than three loose floating widgets - reads as a single "compare"
     unit instead of unrelated form fields. */
  .picker-group {
    display: flex; align-items: center; gap: 2px;
    padding: 3px; border-radius: 11px;
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 255, 255, .07);
  }
  .picker { display: flex; align-items: center; gap: 6px; padding-left: 6px; }
  .picker-icon { width: 15px; height: 15px; flex: none; color: var(--text-dim); }

  /* A custom combobox (button + absolutely-positioned listbox) instead of a native <select> -
     the popped-open option list of a real <select> is native OS/browser chrome, and CSS can
     only reliably touch its background-color/color (barely padding in Chromium); no rounded
     corners, no shadow, no per-row hover, no per-row description text. Rendering the menu in
     our own DOM removes that ceiling entirely. */
  .dd { position: relative; }
  .dd-button {
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 13px; font-weight: 500; color: var(--text);
    width: 8em; /* fixed, not max-width - the button must not resize as the selected label
                   changes length ("Lite" vs "Shadow" vs "Sol"), or the toolbar visibly
                   reflows/jumps every time either side is switched */
    padding: 6px 8px 6px 10px;
    border: 1px solid transparent; border-radius: 7px;
    background-color: rgba(255, 255, 255, .05);
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .dd-button-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-chevron { width: 10px; height: 6px; flex: none; margin-left: auto; color: var(--text-dim); transition: transform .15s ease; }
  .dd-button:hover { background-color: rgba(255, 255, 255, .1); }
  .dd-button:focus-visible {
    outline: none; border-color: var(--accent-2);
    background-color: rgba(255, 255, 255, .1);
    box-shadow: 0 0 0 3px rgba(110, 168, 254, .2);
  }
  .dd-button[aria-expanded="true"] .dd-chevron { transform: rotate(180deg); }

  .dd-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
    margin: 0; padding: 5px; list-style: none;
    min-width: 100%; width: max-content; max-width: 280px; max-height: 60vh; overflow-y: auto;
    background: #17181d; border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
  }
  .dd-menu:focus { outline: none; }
  .dd-option {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 9px; border-radius: 6px; cursor: pointer;
  }
  .dd-option-dot {
    width: 6px; height: 6px; margin-top: 5px; flex: none; border-radius: 50%;
    background: var(--accent-2); opacity: 0; transition: opacity .1s ease;
  }
  .dd-option.is-selected .dd-option-dot { opacity: 1; }
  .dd-option-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .dd-option-label { font-size: 13px; font-weight: 500; color: var(--text); }
  .dd-option.is-selected .dd-option-label { color: var(--accent-2); }
  .dd-option-desc {
    font-size: 11px; font-weight: 400; color: var(--text-dim); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .dd-option.is-active { background: rgba(255, 255, 255, .08); }

  .swap-btn, .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: none;
    border-radius: 50%; border: 1px solid transparent;
    background: transparent; color: var(--text-dim);
    cursor: pointer; text-decoration: none;
    transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), background-color .15s ease, color .15s ease;
  }
  .swap-btn svg, .icon-btn svg { width: 15px; height: 15px; }
  .swap-btn:hover, .icon-btn:hover { background: rgba(255, 255, 255, .1); color: var(--text); }
  .swap-btn:active { transform: rotate(180deg) scale(.92); }
  .swap-btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .icon-btn:hover { color: var(--accent-2); }

  footer {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: center;
    padding: 0 14px 14px;
    pointer-events: none;
  }
  .footer-pill {
    pointer-events: auto;
    padding: 6px 16px; border-radius: 999px;
    font-size: 11px; color: var(--text-dim); text-align: center;
  }
  .footer-pill a { color: var(--text); text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, .3); }
  .footer-pill a:hover { color: var(--accent-2); border-color: var(--accent-2); }

  /* maplibre-gl-compare's own divider line + drag handle, recolored to match this page instead
     of the library's default white/blue - only background-color and box-shadow are touched
     (never the "background" shorthand), since the handle's left-right arrow icon is itself a
     background-image the library's own stylesheet sets and this must not blank out. */
  .maplibregl-compare {
    background-color: rgba(255, 255, 255, .85);
    box-shadow: 0 0 14px rgba(0, 0, 0, .5);
  }
  .maplibregl-compare .compare-swiper-vertical,
  .maplibregl-compare .compare-swiper-horizontal {
    background-color: var(--accent);
    box-shadow: inset 0 0 0 3px rgba(13, 14, 16, .9), 0 8px 22px rgba(0, 0, 0, .45);
  }

  /* Mounted directly on #maps (a sibling of #before/#after, not inside either), so the compare
     slider's clip - which only clips the two map containers - never hides it. Top offset is set
     from JS (header height varies - the picker row wraps at phone widths), not hardcoded here. */
  #nav-control { position: absolute; right: 14px; z-index: 4; }
  .maplibregl-ctrl-group {
    border-radius: 10px !important;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35) !important;
    overflow: hidden;
  }

  #status {
    position: absolute; z-index: 6; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 500; color: var(--text);
  }
  #status[hidden] { display: none; }
  .spinner {
    width: 14px; height: 14px; flex: none;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .25); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
    .swap-btn { transition: none; }
    header, footer { animation: none; }
  }
</style>
</head>
<body>
<div id="maps">
  <div id="before"></div>
  <div id="after"></div>
  <div id="nav-control"></div>
</div>
<header>
  <div class="toolbar glass">
    <div class="brand">
      <div class="brand-row"><span class="brand-dot" aria-hidden="true"></span><h1>UGRC Lite</h1></div>
      <p>Style compare</p>
    </div>
    <div class="picker-group">
      <div class="picker">
        <svg class="picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"/>
          <rect x="3" y="4" width="6" height="16" rx="1" fill="currentColor" fill-opacity=".4" stroke="none"/>
        </svg>
        <div class="dd" id="left-dd">
          <button type="button" class="dd-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Left side">
            <span class="dd-button-label"></span>
            <svg class="dd-chevron" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
          </button>
          <ul class="dd-menu" role="listbox" tabindex="-1" hidden></ul>
        </div>
      </div>
      <button id="swap-btn" class="swap-btn" type="button" title="Swap sides" aria-label="Swap left and right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 3 3 7l4 4"/><path d="M3 7h13a4 4 0 0 1 4 4v1"/>
          <path d="m17 21 4-4-4-4"/><path d="M21 17H8a4 4 0 0 1-4-4v-1"/>
        </svg>
      </button>
      <div class="picker">
        <svg class="picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"/>
          <rect x="15" y="4" width="6" height="16" rx="1" fill="currentColor" fill-opacity=".4" stroke="none"/>
        </svg>
        <div class="dd" id="right-dd">
          <button type="button" class="dd-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Right side">
            <span class="dd-button-label"></span>
            <svg class="dd-chevron" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
          </button>
          <ul class="dd-menu" role="listbox" tabindex="-1" hidden></ul>
        </div>
      </div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <a class="icon-btn" href="https://github.com/ar-puuk/ugrc-styles" target="_blank" rel="noopener" title="View source on GitHub" aria-label="View source on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </div>
</header>
<footer>
  <div class="footer-pill glass">
    Basemap tiles: <a href="https://gis.utah.gov/" target="_blank" rel="noopener">UGRC</a> via Esri ArcGIS Online
  </div>
</footer>
<div id="status" class="glass">
  <div class="spinner" aria-hidden="true"></div>
  <span id="status-text">Loading UGRC's live styles&hellip;</span>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.js"></script>
<script>
"use strict";

const CENTER = [-111.891, 40.761]; // Salt Lake City
const ZOOM = 10;

// UGRC's 3 original services, fetched live (never snapshotted - see README).
const ORIGINAL_SERVICE_URLS = {
  VectorHillshade: "https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/VectorHillshade/VectorTileServer/resources/styles/root.json",
  LiteBase:        "https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/LiteBase/VectorTileServer/resources/styles/root.json",
  LiteLabels:      "https://tiles.arcgis.com/tiles/99lidPhWCzftIe9K/arcgis/rest/services/LiteLabels/VectorTileServer/resources/styles/root.json",
};
const ORIGINAL_KEY = "original";
const DEFAULT_LEFT = ORIGINAL_KEY;
const DEFAULT_RIGHT = "shadow";

function withFormat(url) {
  return url.includes("f=") ? url : url + (url.includes("?") ? "&" : "?") + "f=json";
}

async function fetchJson(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText} fetching ${url}`);
  return resp.json();
}

/** The URL API percent-encodes "{" and "}" (e.g. glyphs' {fontstack}/{range} template),
 * which MapLibre then fails to recognize as tokens. Python's urljoin doesn't have this
 * problem (it does plain string joining, no re-encoding pass) - undo it here to match. */
function joinUrl(base, rel) {
  return new URL(rel, base).href.replace(/%7B/g, "{").replace(/%7D/g, "}");
}

/** A vector source's `url` points at Esri's own VectorTileServer root (both UGRC's live styles
 * and this repo's committed theme styles keep this Esri shape rather than a MapLibre `tiles`
 * array - see source_mode="url" in src/ugrc_styles/engine.py's absolutize(), chosen so the
 * generated styles stay a structural match for hosting as ArcGIS Online Vector Tile Style
 * items). But that endpoint's own tile template is relative ("tile/{z}/{y}/{x}.pbf"), which
 * ArcGIS's own runtime resolves but MapLibre GL JS does not when it fetches a source's `url` as
 * TileJSON - it errors with "Failed to parse URL from tile/..." - so this demo flattens it into
 * an explicit absolute `tiles` array before handing the style to MapLibre. `absUrl` must already
 * be a fully-qualified, trailing-slash URL. */
function vectorUrlSourceToTiles(src, absUrl) {
  if (src.type === "vector") {
    src.tiles = [absUrl + "tile/{z}/{y}/{x}.pbf"];
    delete src.url;
  } else {
    src.url = absUrl;
  }
}

/** JS port of src/ugrc_styles/engine.py's absolutize(): rewrite Esri-relative sprite/glyphs/
 * source paths into absolute, MapLibre-ready URLs. Mutates `style` in place. Needed for
 * "original", whose sprite/glyphs/source paths come straight from UGRC's still-Esri-relative
 * root.json. */
function absolutize(style, styleUrl) {
  const base = styleUrl.split(/[?#]/)[0];
  for (const key of ["sprite", "glyphs"]) {
    if (typeof style[key] === "string") style[key] = joinUrl(base, style[key]);
  }
  for (const src of Object.values(style.sources || {})) {
    if (typeof src.url === "string") {
      let absUrl = joinUrl(base, src.url);
      if (!absUrl.endsWith("/")) absUrl += "/";
      vectorUrlSourceToTiles(src, absUrl);
    }
    if (Array.isArray(src.tiles)) {
      src.tiles = src.tiles.map((t) => joinUrl(base, t));
    }
  }
}

/** A committed theme style's glyphs are already absolute (the Python build always absolutizes
 * that regardless of source_mode), but two things need resolving here before MapLibre can
 * render it:
 *
 * - `sprite` is deliberately left relative (e.g. "../sprites/base-icons-shadow"), written
 *   relative to the style JSON's OWN file location (docs/<theme>/styles/X.json - so "../sprites/"
 *   lands back in docs/<theme>/sprites/). That assumption only holds if something resolves it
 *   against the fetched file's URL. This demo fetches the JSON as plain data and hands MapLibre
 *   the resulting object (not a URL string), so MapLibre has no idea where it came from and
 *   would instead resolve a relative sprite URL against the *page's* location - one level too
 *   high, breaking every icon. So it's resolved by hand here, against `styleUrl` (the style
 *   JSON's own absolute URL). Already-absolute sprite URLs (a build run with --base-url) pass
 *   through unchanged, since `new URL(absolute, base)` ignores `base`.
 * - vector sources are deliberately left in Esri's `url` shape rather than MapLibre's `tiles`
 *   array (see vectorUrlSourceToTiles above) - so this demo has to do that one conversion itself.
 */
function resolveThemeStyle(style, styleUrl) {
  if (typeof style.sprite === "string") {
    style.sprite = joinUrl(styleUrl, style.sprite);
  }
  for (const src of Object.values(style.sources || {})) {
    if (typeof src.url === "string") {
      const absUrl = src.url.endsWith("/") ? src.url : src.url + "/";
      vectorUrlSourceToTiles(src, absUrl);
    }
  }
}

/** JS port of the original R reference script's ugrc_merge_styles(): combine several named styles (each
 * with their own "esri" source) into one MapLibre style, namespacing sources and sprites so
 * they can coexist, and dedup layer ids. List order (Object.keys order) = bottom -> top. */
function mergeStyles(namedStyles, { glyphsFrom } = {}) {
  const names = Object.keys(namedStyles);
  const defaultSprite = names.includes(glyphsFrom) ? glyphsFrom : names[names.length - 1];

  const sources = {};
  const layers = [];
  const sprites = [];
  const idCounts = new Map();

  for (const name of names) {
    const st = namedStyles[name];
    const srcNames = Object.keys(st.sources || {});
    const srcMap = {};
    for (const s of srcNames) {
      srcMap[s] = srcNames.length === 1 ? name : `${name}_${s}`;
      sources[srcMap[s]] = st.sources[s];
    }
    const isDefault = name === defaultSprite;
    if (st.sprite) sprites.push({ id: isDefault ? "default" : name, url: st.sprite });

    for (const ly of st.layers || []) {
      const copy = JSON.parse(JSON.stringify(ly));
      if (copy.source) copy.source = srcMap[copy.source];
      const icon = copy.layout && copy.layout["icon-image"];
      if (!isDefault && typeof icon === "string" && icon) {
        copy.layout["icon-image"] = `${name}:${icon}`;
      }
      const n = idCounts.get(copy.id) || 0;
      idCounts.set(copy.id, n + 1);
      if (n > 0) copy.id = `${copy.id}__${n}`;
      layers.push(copy);
    }
  }

  sprites.sort((a, b) => (a.id === "default" ? -1 : 1) - (b.id === "default" ? -1 : 1));

  return {
    version: 8,
    name: "UGRC merged",
    sprite: sprites,
    glyphs: namedStyles[defaultSprite].glyphs,
    sources,
    layers,
  };
}

async function buildOriginalStyle() {
  const styles = {};
  for (const [name, url] of Object.entries(ORIGINAL_SERVICE_URLS)) {
    const style = await fetchJson(withFormat(url));
    absolutize(style, url);
    styles[name] = style;
  }
  return mergeStyles(styles, { glyphsFrom: "LiteLabels" });
}

async function buildThemeStyle(themeManifest) {
  const styles = {};
  for (const [name, relPath] of Object.entries(themeManifest.styles)) {
    const styleUrl = new URL(relPath, document.baseURI).href;
    const style = await fetchJson(relPath);
    resolveThemeStyle(style, styleUrl);
    styles[name] = style;
  }
  return mergeStyles(styles, { glyphsFrom: "LiteLabels" });
}

/** Every option a picker can offer: "original" (UGRC's live basemap) plus one entry per theme
 * from docs/themes.json - built once at load so left/right pickers, defaults, and the actual
 * style builders all agree on the same list. Each option's `description` is rendered directly
 * in the Dropdown's menu (see below) - a bit of free, unobtrusive context on what each theme
 * actually is, straight from the same text the README and build already carry. */
async function loadOptions() {
  const themes = await fetchJson("themes.json");
  const options = {
    [ORIGINAL_KEY]: {
      label: "Lite",
      description: "UGRC's original Lite basemap, fetched live and unmodified from their ArcGIS services.",
    },
  };
  for (const [name, manifest] of Object.entries(themes)) {
    options[name] = { label: manifest.label, description: manifest.description, manifest };
  }
  return options;
}

/** All currently-open dropdowns close when any other one opens or the page is clicked outside
 * of them - tracked here rather than per-instance so opening #2 doesn't need to know #1 exists. */
const openDropdowns = new Set();
document.addEventListener("click", (e) => {
  for (const dd of [...openDropdowns]) {
    if (!dd.container.contains(e.target)) dd.close();
  }
});

/** A combobox built from a <button> + absolutely-positioned <ul role="listbox"> (see the .dd*
 * CSS) instead of a native <select> - the popped-open list of a real <select> is native OS/
 * browser chrome that CSS can barely touch (background-color/color, a little padding in
 * Chromium - no rounded corners, no shadow, no per-row hover, no per-row description text).
 * Rendering the menu in our own DOM removes that ceiling. Exposes just enough of a <select>'s
 * shape (a `.value` getter/setter, a "change" event) that the rest of this file barely needs to
 * know it isn't one. */
class Dropdown extends EventTarget {
  constructor(container) {
    super();
    this.container = container;
    this.button = container.querySelector(".dd-button");
    this.label = container.querySelector(".dd-button-label");
    this.menu = container.querySelector(".dd-menu");
    this.options = {};
    this._value = null;
    this._activeKey = null;

    this.button.addEventListener("click", () => (this.open ? this.close() : this._openMenu()));
    this.button.addEventListener("keydown", (e) => {
      if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) {
        e.preventDefault();
        this._openMenu();
      }
    });
    this.menu.addEventListener("keydown", (e) => this._onMenuKeydown(e));
  }

  get open() {
    return openDropdowns.has(this);
  }

  setOptions(options) {
    this.options = options;
    this.menu.innerHTML = "";
    for (const [key, opt] of Object.entries(options)) {
      const li = document.createElement("li");
      li.className = "dd-option";
      li.id = `${this.container.id}-opt-${key}`;
      li.role = "option";
      li.dataset.value = key;

      const dot = document.createElement("span");
      dot.className = "dd-option-dot";
      dot.setAttribute("aria-hidden", "true");
      li.appendChild(dot);

      const text = document.createElement("span");
      text.className = "dd-option-text";
      const labelEl = document.createElement("span");
      labelEl.className = "dd-option-label";
      labelEl.textContent = opt.label;
      text.appendChild(labelEl);
      if (opt.description) {
        const descEl = document.createElement("span");
        descEl.className = "dd-option-desc";
        descEl.textContent = opt.description;
        text.appendChild(descEl);
      }
      li.appendChild(text);

      li.addEventListener("click", () => {
        this.value = key;
        this.close();
        this.button.focus();
      });
      li.addEventListener("mousemove", () => this._setActive(key));
      this.menu.appendChild(li);
    }
  }

  get value() {
    return this._value;
  }

  set value(key) {
    if (!(key in this.options)) return;
    const changed = this._value !== key;
    this._value = key;
    this.label.textContent = this.options[key].label;
    for (const li of this.menu.children) {
      li.classList.toggle("is-selected", li.dataset.value === key);
      li.setAttribute("aria-selected", String(li.dataset.value === key));
    }
    if (changed) this.dispatchEvent(new Event("change"));
  }

  _setActive(key) {
    this._activeKey = key;
    for (const li of this.menu.children) {
      li.classList.toggle("is-active", li.dataset.value === key);
    }
    this.button.setAttribute("aria-activedescendant", `${this.container.id}-opt-${key}`);
  }

  _openMenu() {
    for (const dd of [...openDropdowns]) if (dd !== this) dd.close();
    openDropdowns.add(this);
    this.menu.hidden = false;
    this.button.setAttribute("aria-expanded", "true");
    this._setActive(this._value);
    this.menu.focus();
  }

  close() {
    openDropdowns.delete(this);
    this.menu.hidden = true;
    this.button.setAttribute("aria-expanded", "false");
  }

  _onMenuKeydown(e) {
    const keys = Object.keys(this.options);
    let idx = Math.max(keys.indexOf(this._activeKey), 0);
    if (e.key === "ArrowDown") {
      e.preventDefault();
      this._setActive(keys[Math.min(idx + 1, keys.length - 1)]);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      this._setActive(keys[Math.max(idx - 1, 0)]);
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      this.value = this._activeKey;
      this.close();
      this.button.focus();
    } else if (e.key === "Escape") {
      e.preventDefault();
      this.close();
      this.button.focus();
    } else if (e.key === "Tab") {
      this.close();
    }
  }
}

async function main() {
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const leftPick = new Dropdown(document.getElementById("left-dd"));
  const rightPick = new Dropdown(document.getElementById("right-dd"));
  try {
    const options = await loadOptions();
    leftPick.setOptions(options);
    leftPick.value = DEFAULT_LEFT in options ? DEFAULT_LEFT : Object.keys(options)[0];
    rightPick.setOptions(options);
    rightPick.value = DEFAULT_RIGHT in options ? DEFAULT_RIGHT : Object.keys(options)[0];

    // Cache built styles per option key so flipping a picker back and forth doesn't re-fetch.
    const styleCache = new Map();
    async function styleFor(key) {
      if (styleCache.has(key)) return styleCache.get(key);
      const built = key === ORIGINAL_KEY ? await buildOriginalStyle() : await buildThemeStyle(options[key].manifest);
      styleCache.set(key, built);
      return built;
    }

    const before = new maplibregl.Map({
      container: "before", style: await styleFor(leftPick.value), center: CENTER, zoom: ZOOM, attributionControl: false,
    });
    const after = new maplibregl.Map({
      container: "after", style: await styleFor(rightPick.value), center: CENTER, zoom: ZOOM, attributionControl: false,
    });

    // MapLibre's own default attribution control is dropped: it would face the same
    // clipped-inside-a-map-container problem the nav control had, it collides with our footer,
    // and UGRC's "esri" source declares its attribution as the literal string "me" (seemingly a
    // leftover on their end) - not worth solving for text that isn't real credit anyway. Real
    // attribution (UGRC/Esri) is already in our own <footer> below.
    // A single control, shared by both maps: map.addControl() mounts a control INSIDE that
    // map's own container, which the compare slider clips to a left- or right-only region - so
    // whichever map it were attached to, the control would disappear past the slider. Instead
    // call the control's onAdd() directly (bypassing addControl's placement) and mount the
    // resulting element on #maps itself, a sibling of both map containers that's never clipped.
    // "after" and "before" are camera-synced, so binding it to "after" still zooms/pans both.
    const nav = new maplibregl.NavigationControl();
    const navEl = document.getElementById("nav-control");
    navEl.appendChild(nav.onAdd(after));
    // header's height varies (the picker row wraps at phone widths), so measure it instead of
    // assuming a fixed offset - re-measure on resize since wrapping can change.
    const placeNav = () => {
      navEl.style.top = `${document.querySelector("header").getBoundingClientRect().bottom + 10}px`;
    };
    placeNav();
    window.addEventListener("resize", placeNav);

    // Note: UGRC's own font-glyph endpoint 200s with a JSON error body (not real PBF) for a
    // few font names some LiteLabels layers reference - a pre-existing gap in their live font
    // resource, not something introduced here. MapLibre's glyph parser throws on it, and that
    // can keep the map's 'load' event from ever firing even though everything else renders
    // fine - so the compare widget doesn't wait on 'load', just on the first real paint.
    const compare = new maplibregl.Compare(before, after, "#maps", {});
    for (const [label, map] of [["before", before], ["after", after]]) {
      map.on("error", (e) => {
        const err = e && e.error;
        console.error(`[${label}] MapLibre error:`, err ? (err.stack || err.message || String(err)) : String(e));
      });
    }
    Promise.race([
      Promise.all([before, after].map((m) => new Promise((res) => m.once("render", res)))),
      new Promise((res) => setTimeout(res, 4000)),
    ]).then(() => {
      statusEl.hidden = true;
    });

    async function swap(map, key) {
      statusEl.hidden = false;
      statusText.textContent = `Loading ${options[key].label}…`;
      try {
        map.setStyle(await styleFor(key));
      } finally {
        statusEl.hidden = true;
      }
    }
    leftPick.addEventListener("change", () => swap(before, leftPick.value));
    rightPick.addEventListener("change", () => swap(after, rightPick.value));

    document.getElementById("swap-btn").addEventListener("click", () => {
      const l = leftPick.value, r = rightPick.value;
      if (l === r) return;
      // Unlike a native <select>, Dropdown's value setter dispatches "change" itself on any
      // actual change, so the listeners above already do the swap(); assigning here is enough.
      leftPick.value = r;
      rightPick.value = l;
    });
  } catch (err) {
    console.error(err);
    statusText.textContent = "Failed to load: " + err.message;
  }
}

main();
</script>
</body>
</html>
